services:
  web:
    image: ${IMAGE_PREFIX:-go-storage/}web:${RELEASE_VERSION:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:80}

  gateway:
    image: ${IMAGE_PREFIX:-go-storage/}gateway:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      metadata:
        condition: service_started

  migrate:
    image: ${IMAGE_PREFIX:-go-storage/}migrate:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MIGRATIONS_DIRECTORY=file://migrations/metadata

  metadata:
    image: ${IMAGE_PREFIX:-go-storage/}metadata:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/metadata/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

  users:
    image: ${IMAGE_PREFIX:-go-storage/}users:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/users/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

  storage-1:
    image: ${IMAGE_PREFIX:-go-storage/}storage:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/storage/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ID=78463b59-79ee-44c6-b610-18b4549d60f6
      - LISTEN_ADDRESS=:50051
      - ADVERTISE_ADDRESS=storage-1:50051
      - UPLOAD_ROOT=/uploads

  storage-2:
    image: ${IMAGE_PREFIX:-go-storage/}storage:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/storage/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ID=203faea7-1211-4234-8733-05cc840e348f
      - LISTEN_ADDRESS=:50051
      - ADVERTISE_ADDRESS=storage-2:50051
      - UPLOAD_ROOT=/uploads

  storage-3:
    image: ${IMAGE_PREFIX:-go-storage/}storage:${RELEASE_VERSION:-latest}
    build:
      context: .
      dockerfile: cmd/storage/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ID=111ebee6-29c7-46fe-ac62-85489820eec9
      - LISTEN_ADDRESS=:50051
      - ADVERTISE_ADDRESS=storage-3:50051
      - UPLOAD_ROOT=/uploads

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    restart: unless-stopped
    tty: true
    stdin_open: true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 5
