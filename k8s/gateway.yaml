apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for metadata service at $METADATA_HOST:$METADATA_PORT..."
              until nc -z -w 2 "$METADATA_HOST" "$METADATA_PORT"; do
                sleep 2
              done
              echo "Metadata service is reachable!"

              echo "Waiting for users service at $USERS_HOST:$USERS_PORT..."
              until nc -z -w 2 "$USERS_HOST" "$USERS_PORT"; do
                sleep 2
              done
              echo "Users service is reachable!"
          env:
            - name: METADATA_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.host
            - name: METADATA_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.port 
            - name: USERS_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.host
            - name: USERS_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.port 
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: gateway
          image: go-storage/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: gateway.port
            - name: SERVER_ADDRESS
              value: ":$(SERVER_PORT)"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: log.level
            - name: METADATA_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.host
            - name: METADATA_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.port 
            - name: METADATA_SERVICE_ADDRESS
              value: "$(METADATA_HOST):$(METADATA_PORT)"
            - name: USERS_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.host
            - name: USERS_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.port 
            - name: USERS_SERVICE_ADDRESS
              value: "$(USERS_HOST):$(USERS_PORT)"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
