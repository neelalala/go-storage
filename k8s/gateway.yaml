apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: go-storage/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: SERVER_ADDRESS
              value: ":80"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: METADATA_SERVICE_ADDRESS
              value: "metadata:50051"
            - name: USERS_SERVICE_ADDRESS
              value: "users:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80