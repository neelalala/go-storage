apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: go-storage/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: gateway.port
            - name: SERVER_ADDRESS
              value: ":$(SERVER_PORT)"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: log.level
            - name: METADATA_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.host
            - name: METADATA_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.port 
            - name: METADATA_SERVICE_ADDRESS
              value: "$(METADATA_HOST):$(METADATA_PORT)"
            - name: USERS_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.host
            - name: USERS_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.port 
            - name: USERS_SERVICE_ADDRESS
              value: "$(USERS_HOST):$(USERS_PORT)"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
