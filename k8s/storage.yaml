apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  clusterIP: None
  selector:
    app: storage
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
spec:
  serviceName: storage
  replicas: 3
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels: 
        app: storage
    spec: 
      initContainers:
        - name: wait-for-metadata
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for metadata at $DISCOVERY_HOST:$DISCOVERY_PORT..."
              until nc -z -w 2 "$DISCOVERY_HOST" "$DISCOVERY_PORT"; do
                echo "metadata service is not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "metadata service is reachable!"
          env:
            - name: DISCOVERY_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.host
            - name: DISCOVERY_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.port
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: storage
          image: go-storage/storage:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: storage.port
            - name: LISTEN_ADDRESS
              value: ":$(SERVER_PORT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ADVERTISE_ADDRESS
              value: "$(POD_NAME).storage:$(SERVER_PORT)"
            - name: UPLOAD_ROOT
              value: "/uploads"
            - name: DISCOVERY_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.host
            - name: DISCOVERY_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: metadata.port
            - name: DISCOVERY_SERVICE_ADDRESS
              value: "$(DISCOVERY_HOST):$(DISCOVERY_PORT)"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: log.level
          volumeMounts:
            - name: storage-data
              mountPath: /uploads
  volumeClaimTemplates:
    - metadata:
        name: storage-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
