apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: go-storage/web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: GATEWAY_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: gateway.host 
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: gateway.port 
            - name: GATEWAY_URL
              value: "http://$(GATEWAY_HOST):$(GATEWAY_PORT)"
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
