apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: go-storage/users:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: SERVER_ADDRESS
              value: ":50051"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: users
spec:
  selector:
    app: users
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
