apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL at $DB_HOST:$DB_PORT..."
              until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do
                sleep 2
              done
              echo "PostgreSQL is reachable!"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.port
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: users
          image: go-storage/users:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.port
            - name: SERVER_ADDRESS
              value: ":$(SERVER_PORT)"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: log.level
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: users
spec:
  selector:
    app: users
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
