apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: go-storage/users:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: users.server.port
            - name: SERVER_ADDRESS
              value: ":$(SERVER_PORT)"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: log.level
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: db.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: users
spec:
  selector:
    app: users
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
