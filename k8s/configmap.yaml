apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
data:
  # Database
  db.host: postgres
  db.port: "5432"
  db.name: postgres_db
  db.data: /var/lib/postgresql/data/pgdata
  
  # Redis
  redis.host: redis
  redis.port: "6379"

  # Gateway
  gateway.host: "gateway"
  gateway.port: "80"

  # Metadata
  metadata.host: metadata
  metadata.port: "50051"

  # Users
  users.host: users
  users.port: "50051"

  # Storage
  storage.port: "50051"

  # Logs
  log.level: INFO
